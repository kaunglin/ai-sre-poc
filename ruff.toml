# Pin the lint rule set explicitly.
#
# CI runs an unpinned `pip install ruff`, and ruff's *default* selection has
# broadened over releases — a new version can fail the build with no code
# change. Selecting rules here makes CI reproducible regardless of version.
#
# E4/E7/E9 + F are ruff's long-standing defaults (pycodestyle errors, pyflakes).
# I adds import sorting.
#
# Deliberately NOT enabled: BLE001 (blanket except) and S110 (try-except-pass).
# The services use `except Exception` on purpose around optional dependencies —
# a Redis cache miss or a probe hiccup must never take the request path down.
# Those are design decisions, not oversights.
[lint]
select = ["E4", "E7", "E9", "F", "I"]
